services:
  fooddelivery.api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fooddelivery-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=fooddelivery.sqlserver,1433;Database=FoodDeliveryDb;User Id=sa;Password=${SA_PASSWORD:-Your_password123};TrustServerCertificate=True
      - Jwt__Key=${JWT_KEY:-docker-compose-demo-key-change-me-0123456789}
    depends_on:
      fooddelivery.sqlserver:
        # The API applies migrations on startup, so it must wait until SQL Server accepts connections.
        condition: service_healthy

  fooddelivery.sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fooddelivery-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:-Your_password123}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqlserver-data:
